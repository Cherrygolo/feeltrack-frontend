<div class="flex flex-col min-h-screen font-sans bg-secondary">

  <app-header></app-header>

  <div class="flex flex-col flex-1 pt-header">

    @if (coldStartNotifier.visible()) {
      <div
        class="
          flex items-center justify-center gap-3
          px-4 py-3
          bg-white/90
          backdrop-blur
          border-b border-primary/10
          shadow-sm
        "
      >
        <div
          class="
            w-5 h-5
            rounded-full
            border-2 border-gray-200
            border-t-primary
            animate-spin
          "
        ></div>

        <p class="text-sm text-font text-center">
          {{ coldStartNotifier.message() }}
        </p>
      </div>
    }

    <main class="flex flex-col flex-1 gap-6 px-8">
      <router-outlet></router-outlet>
    </main>

  </div>

  <app-footer></app-footer>

</div>
